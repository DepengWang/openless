name: One-off iOS asset upload

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag
        required: true
        type: string
      source_url:
        description: Temporary URL serving the IPA
        required: true
        type: string
      asset_name:
        description: Release asset filename
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download IPA
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1200 \
            "$SOURCE_URL" -o "$RUNNER_TEMP/openless-ios.ipa"
          test -s "$RUNNER_TEMP/openless-ios.ipa"
          ls -lh "$RUNNER_TEMP/openless-ios.ipa"

      - name: Attach IPA to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/openless-ios.ipa#$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY" --clobber
